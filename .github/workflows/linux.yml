name: Run plugin on Linux
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        check-latest: true
    - name: Install latest Chrome
      run: |
        sudo install -d -m 0755 /etc/apt/keyrings
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor --yes -o /etc/apt/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
        sudo apt-get update
        sudo apt-get --only-upgrade install google-chrome-stable
        google-chrome --version
    - name: Browser versions
      run: |
        google-chrome --version
    - name: Install sitespeed.io
      run: |
        npm install sitespeed.io -g
        cd ../plugin-html
        npm install
    - name: Start local HTTP server
      run: (npm run start-server&)
    - name: Lint
      run: npm run lint
    - name: Show sitespeed.io version
      run: sitespeed.io --version
    - name: Run tests using plugin
      run: sitespeed.io --plugins.add ./lib/index.js --browsertime.chrome.includeResponseBodies all --xvfb -n 1 http://127.0.0.1:3000/
 